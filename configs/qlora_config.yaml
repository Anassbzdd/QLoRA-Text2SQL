model:
  base_model: Qwen/Qwen2.5-Coder-14B-Instruct
  model_name: Sql_model
  trust_remote_code: true
  torch_dtype: float16
  device_map: auto
  use_cache: false
  gradient_checkpointing: true

tokenizer:
  name: Qwen/Qwen2.5-Coder-14B-Instruct
  use_fast: true
  padding_side: right

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: float16
  bnb_4bit_use_double_quant: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

data:
  train_file: processed/train_assembled.jsonl
  val_file: processed/val_assembled.jsonl
  max_seq_length: 2048

training:
  output_dir: outputs/checkpoints/spider-qwen-coder-14b
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  num_train_epochs: 3
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  optim: paged_adamw_8bit
  fp16: true
  bf16: false
  tf32: false
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  max_grad_norm: 1.0
  weight_decay: 0.01
  dataloader_num_workers: 0
  dataloader_pin_memory: false
  group_by_length: true
  logging_steps: 10
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 2
  report_to: none
